# Copy this file outside the repo and fill it in; set ROUTES_PATH to the copy's path.
# One [routes.<name>] table per intake channel. The name is lowercase letters, digits,
# - or _, starting with a letter or digit; later per-route settings key off it.
# The bot reads this file once at startup: restart it after a change.

[routes.c4i]
# Discord Developer Mode, right-click #c4i-github-issues, Copy Channel ID. 0 is rejected.
channel_id = 0
# startup sanity check only
channel_name = "c4i-github-issues"
# startup sanity check only
category = "C4I"
repo = "4IRL/chores4irl"
# `gh api repos/4IRL/chores4irl --jq .id`. 0 is rejected.
repo_id = 0

[routes.c4i.labels]
bug = "bug"
feature = "enhancement"

# The modal's questions for each issue type: 1 to 4 per type, asked below the Title.
# They replace a free-form description; the filed issue gets one section per answered question.
# Each question has exactly these keys:
#   label    - the question text, 1 to 45 characters, unique within the type
#   style    - "short" (one line) or "paragraph" (several lines)
#   required - true or false
[[routes.c4i.questions.bug]]
label = "Steps to reproduce"
style = "paragraph"
required = true

[[routes.c4i.questions.bug]]
label = "Expected"
style = "paragraph"
required = true

[[routes.c4i.questions.bug]]
label = "Actual"
style = "paragraph"
required = true

[[routes.c4i.questions.bug]]
label = "Device / browser"
style = "short"
required = false

[[routes.c4i.questions.feature]]
label = "Who is it for?"
style = "short"
required = true

[[routes.c4i.questions.feature]]
label = "What problem does it solve?"
style = "paragraph"
required = true

[[routes.c4i.questions.feature]]
label = 'What does "done" look like?'
style = "paragraph"
required = false

# Optional: the GitHub Project (roadmap) each filed issue is added to. Delete this table for a
# route with no roadmap. The names must match the Project's own field and option names, and
# the Effort field needs one option per complexity band: S, M, L and XL.
[routes.c4i.project]
# The number at the end of the Project's URL, github.com/orgs/<org>/projects/<number>.
number = 2
status_field = "Status"
status = "Todo"
effort_field = "Effort"
